<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>SCALE Digital Literacy — Print &amp; Practice Center</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&display=swap">
<style>
:root{--bg:#F6F4EE;--card:#FFFFFF;--ink:#1F2328;--muted:#555B63;--line:#D6D2C8;--accent:#1E5AA8;--accent-soft:#E6EEF8;--warn:#A8480A;--warn-soft:#FBE3D0;--ok:#1F7A4D;
 box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--bg:#15181C;--card:#1E2227;--ink:#ECEEF0;--muted:#A9B0B8;--line:#3A4048;--accent:#7FB0F0;--accent-soft:#1D2B3D;--warn:#F0A060;--warn-soft:#3A2618;--ok:#6CCB98}}
:root[data-theme="dark"]{--bg:#15181C;--card:#1E2227;--ink:#ECEEF0;--muted:#A9B0B8;--line:#3A4048;--accent:#7FB0F0;--accent-soft:#1D2B3D;--warn:#F0A060;--warn-soft:#3A2618;--ok:#6CCB98}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:'Atkinson Hyperlegible',Verdana,Arial,sans-serif;font-size:17px;line-height:1.45}
a{color:var(--accent)}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--card);border-bottom:1px solid var(--line);padding:10px 16px;display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.top b{font-size:17px}.crumbs{color:var(--muted);font-size:15px;flex:1;min-width:200px}
.btn{font:inherit;font-size:15px;padding:8px 14px;border-radius:8px;border:1.5px solid var(--accent);background:var(--accent);color:#fff;cursor:pointer}
.btn.ghost{background:transparent;color:var(--accent)}
main{max-width:1000px;margin:0 auto;padding:18px 16px 60px}
h1{font-size:28px;margin:6px 0 10px}h2{font-size:21px;margin:22px 0 8px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px}
.tile{display:block;background:var(--card);border:1.5px solid var(--line);border-radius:10px;padding:14px;text-decoration:none;color:var(--ink)}
.tile:hover{border-color:var(--accent)}.tile small{display:block;color:var(--muted);font-size:14px;margin-top:4px}
.note{background:var(--accent-soft);border-radius:10px;padding:12px 14px;font-size:15px}
ul.links{padding-left:20px}ul.links li{margin:6px 0}
.pill{display:inline-block;font-size:13px;font-weight:700;padding:2px 9px;border-radius:12px;background:var(--accent-soft);color:var(--accent);margin-right:6px}
/* paper */
.paperwrap{overflow-x:auto;padding:8px 0}
.sheet{background:#fff;color:#1F2328;width:8.5in;max-width:100%;min-height:10.6in;margin:0 auto 18px;padding:0.5in;box-shadow:0 1px 6px rgba(0,0,0,.18);display:flex;flex-direction:column;gap:12px}
.sheet h1{font-size:34px;margin:0}.sheet .kicker{font-size:14px;font-weight:700;letter-spacing:1px;color:#1E5AA8}
.sheet.big{font-size:21px}.sheet.big h1{font-size:44px}
.line{flex:1;border-bottom:2px solid #1F2328;min-height:30px}
.row{display:flex;align-items:flex-end;gap:10px}
.box{display:inline-block;width:26px;height:26px;border:2.5px solid #1F2328;border-radius:4px;flex-shrink:0;vertical-align:middle}
.frame{border:2px solid #1F2328;border-radius:10px;padding:14px 16px}
.frame.blue{border-color:#1E5AA8;background:#E6EEF8}.frame.warn{border-color:#A8480A;background:#FBE3D0}
.cut{border-top:2px dashed #777;margin:6px 0}
.cards{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.pcard{border:2.5px solid #1F2328;border-radius:12px;min-height:2.6in;padding:18px;display:flex;flex-direction:column;justify-content:space-between}
.pcard .t{font-size:30px;font-weight:700;line-height:1.2}.pcard .f{font-size:14px;color:#555}
table.t{border-collapse:collapse;width:100%}table.t td,table.t th{border:1.5px solid #1F2328;padding:8px;text-align:left;vertical-align:top}
table.t th{background:#E6EEF8}
.mods{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}.mods div{border:2px solid #1F2328;border-radius:8px;padding:8px;font-size:15px}
/* app mock */
.phone{max-width:420px;margin:0 auto;background:var(--card);border:2px solid var(--line);border-radius:26px;overflow:hidden}
.appbar{padding:16px;color:#fff;font-weight:700;font-size:20px}
.tabs{display:flex;border-bottom:1px solid var(--line)}.tabs button{flex:1;font:inherit;font-size:14px;padding:10px 4px;border:0;background:transparent;color:var(--ink);cursor:pointer;border-bottom:3px solid transparent}
.tabs button.on{border-bottom-color:var(--accent);font-weight:700}
.pane{padding:16px}.pane p{margin:8px 0}
.set{display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-bottom:1px solid var(--line);gap:10px}
.sw{appearance:none;width:46px;height:26px;border-radius:13px;background:#9AA0A6;position:relative;cursor:pointer;flex-shrink:0}
.sw:checked{background:#1F7A4D}.sw::after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:#fff;transition:left .15s}.sw:checked::after{left:23px}
.pop{border:2px solid var(--line);border-radius:14px;padding:16px;margin:10px 0;background:var(--bg)}
.banner{padding:12px;border-radius:10px;background:var(--warn-soft);color:var(--ink);border:1.5px solid var(--warn);margin-bottom:10px}
.pol h3{font-size:16px;margin:12px 0 4px}
.trl{display:block;font-size:.72em;font-style:italic;font-weight:400;color:#3F4650;margin-top:2px;line-height:1.3}
.langbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:14px}.langbar select,.langbar input{font:inherit;font-size:14px;padding:6px;border-radius:6px;border:1.5px solid var(--line);background:var(--bg);color:var(--ink)}
#trstatus{font-size:13px;color:var(--muted)}
.practice{font-size:13px;color:var(--muted);text-align:center;padding:8px}
/* forms */
.form{background:var(--card);border:1.5px solid var(--line);border-radius:12px;padding:18px;max-width:620px;margin:0 auto}
.fld{margin:12px 0}.fld label{display:block;font-weight:700;margin-bottom:4px}.fld input,.fld select{font:inherit;width:100%;padding:9px;border:1.5px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink)}
.fld.bad input{border-color:#C0392B}.err{color:#C0392B;font-size:15px;margin-top:4px}
.topErr{background:#FDECEA;color:#8E1B10;border:1.5px solid #C0392B;border-radius:8px;padding:10px;margin-bottom:8px}
.conf{border:2px solid var(--ok);border-radius:12px;padding:18px;max-width:620px;margin:0 auto}
@page{size:letter;margin:0.4in}
@media print{
 .top,.noprint,.practice{display:none!important}
 body{background:#fff;color:#000}main{max-width:none;padding:0}
 .sheet{box-shadow:none;margin:0;padding:0;width:auto;min-height:0;page-break-after:always}
 .paperwrap{overflow:visible;padding:0}
 .tabs{display:none}.pane{display:block!important;page-break-inside:avoid}
 .phone{border:1px solid #999;max-width:none}
}
</style>
</head>
<body>
<div class="top"><b>SCALE Digital Literacy — Print &amp; Practice Center</b><span class="crumbs" id="crumbs"></span>
<span class="langbar noprint"><label for="lang">Home language on printables:</label>
<select id="lang"><option value="">English only</option><option value="pt">English + Português (Brasil)</option><option value="es">English + Español</option><option value="ht">English + Kreyòl ayisyen</option></select>
<span id="trstatus"></span></span>
<span class="langbar noprint"><label for="goto">Page code:</label><input id="goto" placeholder="e.g. CITYCART" style="width:130px;text-transform:uppercase"><button class="btn" type="button" id="gobtn">Go</button><span id="gomsg"></span></span>
<a class="btn ghost" href="#/">Home</a><button class="btn" id="printBtn" type="button">Print</button></div>
<main id="view"></main>
<script>
const MODS=[{"L": 1, "n": 1, "mod": "Get Started", "act": "Find Your Way", "cando": "I can sign in, get around a website, and sign out.", "weeks": "1–3", "cards": ["My mouse isn't working.", "The screen is black.", "The words are too small."], "stop": "Put your paper work in your folder. Mark your next step. Sign out and close all tabs.", "ext": ["Find the class calendar and the name of one SCALE teacher. Write where you found them.", "Open the SCALE page in a second tab. Switch between tabs 3 times, then close one tab.", "Expert: make a 3-step picture guide 'How to find the phone number' for a new student."]}, {"L": 1, "n": 2, "mod": "Find Information", "act": "Answer Hunt", "cando": "I can find information I need, like hours, an address, or a bus time.", "weeks": "4–6", "cards": ["This page is from 2022.", "No answer. Try different words.", "The map shows a different city."], "stop": "Put your paper work in your folder. Mark your next step. Sign out and close all tabs.", "ext": ["For each answer, also find the walking time or the bus number.", "Find the same answer on two different websites. Are they the same?", "Expert: write a new need card for the class (question + where to look)."]}, {"L": 1, "n": 3, "mod": "Fill Out a Form", "act": "Form Detective", "cando": "I can fill out a short online form and find mistakes.", "weeks": "7–9", "cards": ["Error: date of birth.", "This field is required.", "Phone number is too short."], "stop": "Put your paper work in your folder. Mark your next step. Sign out and close all tabs.", "ext": ["Find the 6th hidden problem on Ana's form (the email has no @).", "Add an emergency contact to your own form.", "Expert: make a broken form for a partner — change 3 things, then your partner finds them."]}, {"L": 1, "n": 4, "mod": "Communicate", "act": "Which Message?", "cando": "I can choose and write the right message for the situation.", "weeks": "10–12", "cards": ["You sent it to the wrong Maria.", "You forgot to say how late.", "Your message has no name."], "stop": "Put your paper work in your folder. Mark your next step. Sign out and close all tabs.", "ext": ["Write the same message two ways: to your boss and to a friend.", "Reply to the teacher's email with a question of your own.", "Expert: write a new 'Which Message?' round (A, B, C) for the class."]}, {"L": 1, "n": 5, "mod": "Manage Documents", "act": "Document Rescue", "cando": "I can take a clear photo of a paper, save it, find it, and send it.", "weeks": "13–15", "cards": ["Your photo is blurry.", "You took the wrong paper.", "Part of the page is cut off."], "stop": "Put your paper work in your folder. Mark your next step. Sign out and close all tabs.", "ext": ["Put 2 photos in one email and write a subject line.", "Rename the photo so you can find it (Form_Lastname).", "Expert: check 3 classmates' photos with the 3 questions and explain one fix."]}, {"L": 1, "n": 6, "mod": "Create a Document", "act": "My One-Page Profile", "cando": "I can make a one-page profile about my work and skills.", "weeks": "16–18", "cards": ["I can't find my file.", "My file is called 'Document 1'."], "stop": "The paper draft goes in the folder. Learners type, save, find, and open the file in one session, then sign out.", "ext": ["Add a 'Skills' list with 5 skills and one sentence about your best job.", "Change the font size and make the headings bold.", "Expert: interview a partner and help them finish one section."]}, {"L": 1, "n": 7, "mod": "Complete a Process Online", "act": "Weekend Challenge", "cando": "I can find something useful in my community, sign up, and share the information.", "weeks": "19–21", "cards": ["The event is full.", "The event is canceled.", "It costs $20, not free."], "stop": "Stop after the sign-up. Copy the confirmation code, date, and time onto the Weekend Card (Confirmed box). Week C restarts from the Weekend Card in the folder.", "ext": ["Find the bus route or walking time to your event.", "Find a second event for Plan B before the twist card.", "Expert: compare two events for your family (cost, time, place) and choose one."]}, {"L": 1, "n": 8, "mod": "Participate Online", "act": "Meeting Problems", "cando": "I can join a video call and fix simple problems.", "weeks": "22–24", "cards": ["Your microphone doesn't work.", "Your camera is off.", "You don't understand the question.", "The call dropped."], "stop": "Put your paper work in your folder. Mark your next step. Sign out and close all tabs.", "ext": ["Use the chat box: type 'Can you repeat that, please?'", "Describe two symptoms and how long you've had them.", "Expert: play the 'doctor' and ask 3 questions."]}, {"L": 1, "n": 9, "mod": "Protect Myself Online", "act": "Scam or Safe?", "cando": "I can decide what to do when a message looks wrong.", "weeks": "25–27", "cards": ["You clicked the link.", "The page asks for your password.", "A number keeps texting you."], "stop": "Put your paper work in your folder. Mark your next step. Sign out and close all tabs.", "ext": ["Find 2 clues in each message (sender, link, money, hurry).", "Explain the four steps to a partner in English.", "Expert: make a new NOT SAFE message poster with 3 clues."]}, {"L": 1, "n": 10, "mod": "Do It Myself", "act": "The School Mission", "cando": "I can complete a real scenario by myself.", "weeks": "28–30", "cards": ["Page not found."], "stop": "Put your paper work in your folder. Mark your next step. Sign out and close all tabs.", "ext": ["Finish the mission, then write 'First I… then I… last I…' with 4 steps.", "Help design a mission for next year's class (on paper).", "Expert: after your mission, observe a Level 1 station as a 'quiet helper' — point, don't touch."]}, {"L": 2, "n": 1, "mod": "Get Started", "act": "Set Up Carlos's Phone", "cando": "I can set up a phone for work and daily life.", "weeks": "1–3", "cards": ["Storage full. Can't install.", "The Wi-Fi password is wrong.", "The reminder didn't ring."], "stop": "Put your paper work in your folder. Mark your next step. Sign out and close all tabs.", "ext": ["Set up 'Do Not Disturb' for Carlos's work hours.", "Add a home-screen shortcut for a website Carlos needs (his bus schedule).", "Expert: write a 5-step setup guide for a new phone user."]}, {"L": 2, "n": 2, "mod": "Find Information", "act": "Which One Would You Choose?", "cando": "I can find and compare options, then choose the best one for a person's needs.", "weeks": "4–6", "cards": ["No appointments this month.", "This site is from last year.", "It needs an appointment you can't make."], "stop": "Put your paper work in your folder. Mark your next step. Sign out and close all tabs.", "ext": ["Add a fourth option you find yourself and compare it.", "Weight the needs: which need matters MOST for this person?", "Expert: write a new persona card with 3 needs for classmates."]}, {"L": 2, "n": 3, "mod": "Fill Out a Form", "act": "Form Detective: Level Up", "cando": "I can find and fix problems on a longer form.", "weeks": "7–9", "cards": ["Your session has expired.", "Invalid email.", "Page 2 is not complete."], "stop": "Put your paper work in your folder. Mark your next step. Sign out and close all tabs.", "ext": ["Find the problem nobody listed (hidden page 3 or wrong state).", "Complete the form in under 8 minutes with no errors.", "Expert: write an error-message glossary (5 errors + what they mean)."]}, {"L": 2, "n": 4, "mod": "Communicate", "act": "The Friday Off", "cando": "I can handle a real conversation by message, even when things change.", "weeks": "10–12", "cards": ["The supervisor says no.", "Your coworker offers to switch.", "Put it in writing.", "You hit Reply All."], "stop": "Put your paper work in your folder. Mark your next step. Sign out and close all tabs.", "ext": ["Handle all three twist cards in one conversation.", "Rewrite a rude message politely.", "Expert: play the supervisor and add a new twist."]}, {"L": 2, "n": 5, "mod": "Manage Documents", "act": "Help the Caseworker", "cando": "I can find the right documents, organize them, and send them.", "weeks": "13–15", "cards": ["File too large.", "Wrong file type.", "You sent the old pay stub."], "stop": "Stop after sorting. Write the two correct files and their new names on the Stop-Point Sheet. Next week the DL staff reloads the practice folder; learners rename from the sheet (2 min) and continue at \"attach and send.\"", "ext": ["Make 3 folders (Housing, Work, School) and sort all files.", "Combine two files into one PDF.", "Expert: create a messy folder for a partner to sort."]}, {"L": 2, "n": 6, "mod": "Create a Document", "act": "Make Something Useful", "cando": "I can create a useful document and check it.", "weeks": "16–18", "cards": ["Spell-check changed your name.", "The PDF won't open."], "stop": "Put your paper work in your folder. Mark your next step. Sign out and close all tabs.", "ext": ["Make a second product from the list.", "Add a table or a picture to your document.", "Expert: give 2 classmates 'star and step' feedback with the checklist."]}, {"L": 2, "n": 7, "mod": "Complete a Process Online", "act": "Digital Life Challenge", "cando": "I can figure out which tools I need and complete a real process.", "weeks": "19–21", "cards": ["That time is gone. Reschedule.", "They need a document you haven't scanned.", "The portal asks for a code."], "stop": "The paper Mission Planner goes in the learner folder. Next week restarts from the plan.", "ext": ["Do two scenario cards with different tools.", "Add the appointment to a calendar with a reminder.", "Expert: write a new scenario card with a twist."]}, {"L": 2, "n": 8, "mod": "Participate Online", "act": "Meeting Problems: Conference Edition", "cando": "I can take part in an online meeting and handle problems.", "weeks": "22–24", "cards": ["Your microphone doesn't work.", "Your connection drops.", "You don't understand.", "Show the report card."], "stop": "Put your paper work in your folder. Mark your next step. Sign out and close all tabs.", "ext": ["Share a photo on screen instead of holding the paper.", "Summarize the whole conference in 3 sentences.", "Expert: host a small room and give the problem cards."]}, {"L": 2, "n": 9, "mod": "Protect Myself Online", "act": "Scam or Safe? Level 2", "cando": "I can check whether a message or website is real before I act.", "weeks": "25–27", "cards": ["You typed your password on a fake site.", "The code didn't arrive."], "stop": "Put your paper work in your folder. Mark your next step. Sign out and close all tabs.", "ext": ["Find 3 differences between a real and fake site on your own.", "Explain what 2-step verification does, in your own words.", "Expert: make a 'Scam or Safe?' quiz with 4 messages."]}, {"L": 2, "n": 10, "mod": "Do It Myself", "act": "The Clinic Mission", "cando": "I can complete a real scenario by myself.", "weeks": "28–30", "cards": ["Upload failed: file too large."], "stop": "Put your paper work in your folder. Mark your next step. Sign out and close all tabs.", "ext": ["Finish, then write one tip for a future student.", "Complete Mission 2 with no hints.", "Expert: help design next year's mission on paper."]}, {"L": 3, "n": 1, "mod": "Get Started", "act": "Something Is Wrong", "cando": "I can investigate a problem with my phone or account and fix it.", "weeks": "1–3", "cards": ["I'm locked out of my email.", "It says 'Wrong password.'", "The recovery code went to an old phone."], "stop": "Put your paper work in your folder. Mark your next step. Sign out and close all tabs.", "ext": ["Compare permissions for 2 apps that do the same thing.", "Find the ad-tracking setting and explain what it does.", "Expert: write a one-page 'Phone Privacy Check' for families."]}, {"L": 3, "n": 2, "mod": "Find Information", "act": "Internet Detective", "cando": "I can investigate whether online information is true.", "weeks": "4–6", "cards": ["Two sources disagree.", "The page has no date.", "The source sells the product."], "stop": "Put your paper work in your folder. Mark your next step. Sign out and close all tabs.", "ext": ["Investigate a claim with a chart or statistic in it.", "Find the original source of a quote.", "Expert: write a claim station for the class with an answer key."]}, {"L": 3, "n": 3, "mod": "Fill Out a Form", "act": "Application Rescue", "cando": "I can figure out why an online application won't submit and fix it.", "weeks": "7–9", "cards": ["File type not supported.", "Maximum 500 characters.", "Required field missing."], "stop": "Copy completed answers onto the paper form checklist in the folder. Mark the restart card. Sign out.", "ext": ["Rescue a third broken application with 3 hidden problems.", "Write a help email to the program describing the error.", "Expert: build a broken form for classmates."]}, {"L": 3, "n": 4, "mod": "Communicate", "act": "Workplace Chat Simulation", "cando": "I can communicate professionally at work by chat and email as situations change.", "weeks": "10–12", "cards": ["You posted in the wrong channel.", "You replied to the wrong person."], "stop": "Put your paper work in your folder. Mark your next step. Sign out and close all tabs.", "ext": ["Handle a customer complaint and escalate it correctly.", "Write the same update for chat, email, and a meeting.", "Expert: play the manager and post event cards."]}, {"L": 3, "n": 5, "mod": "Manage Documents", "act": "Share It Right", "cando": "I can organize my files and share them safely.", "weeks": "13–15", "cards": ["Anyone with the link can edit.", "Wrong file attached.", "A private file is in the folder."], "stop": "Put your paper work in your folder. Mark your next step. Sign out and close all tabs.", "ext": ["Set a sharing expiration date or remove access after a week.", "Create a naming system for all your files.", "Expert: audit a classmate's folder and write 3 fixes."]}, {"L": 3, "n": 6, "mod": "Create a Document", "act": "Résumé Makeover", "cando": "I can create a résumé that matches a job.", "weeks": "16–18", "cards": ["T function form(key){
 const f=FORMS[key];C.innerHTML=`<a href="#/L1-M3">L1-M3</a> › ${esc(f.title)}`;
 const L=f.clinic?{first:"Patient first name",last:"Patient last name",dob:"DOB (MM/DD/YYYY)",phone:"Phone",street:"Street address",city:"City",guests:"Reason for visit"}
  :{first:"First name",last:"Last name",dob:"Date of birth (MM/DD/YYYY)",phone:"Phone number",street:"Street address",city:"City",guests:"Number of people coming"};
 const fld=k=>`<div class="fld" id="f-${k}"><label for="i-${k}">${L[k]} <span style="color:#C0392B">*</span></label><input id="i-${k}" value="${esc(f.pre[k]||"")}"><div class="err"></div></div>`;
 V.innerHTML=`<p class="note noprint">${esc(f.who)}</p><div class="form"><h1 style="font-size:24px">${esc(f.title)}</h1><div style="font-size:14px;color:var(--muted)">* Required</div><div id="top"></div>
 ${["first","last","dob","phone","street","city","guests"].map(fld).join("")}<button class="btn" type="button" id="sub">Submit</button></div><div id="done"></div><div class="practice">Practice form for SCALE classes</div>`;
 document.getElementById('sub').onclick=()=>{
  const v=k=>document.getElementById('i-'+k).value.trim();const errs={};
  ["first","last","city","guests","street","dob","phone"].forEach(k=>{if(!v(k))errs[k]="This field is required."});
  if(v('dob')&&!errs.dob){const m=v('dob').match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})$/);if(!m||+m[1]<1||+m[1]>12||+m[2]<1||+m[2]>31)errs.dob=f.clinic?"Error: date of birth. Use MM/DD/YYYY.":"Use month/day/year: MM/DD/YYYY."}
  if(v('phone')&&!errs.phone&&v('phone').replace(/\D/g,'').length!==10)errs.phone="Phone number is too short. Use 10 numbers.";
  if(v('street')&&!errs.street&&!/\d/.test(v('street')))errs.street="Street address needs a number and a street name.";
  ["first","last","dob","phone","street","city","guests"].forEach(k=>{const el=document.getElementById('f-'+k);el.classList.toggle('bad',!!errs[k]);el.querySelector('.err').textContent=errs[k]||""});
  const n=Object.keys(errs).length;
  document.getElementById('top').innerHTML=n?`<div class="topErr">${f.clinic&&errs.dob?"Error: date of birth. ":""}Please fix ${n} error${n>1?'s':''}.</div>`:"";
  if(!n){document.querySelector('.form').style.display='none';document.getElementById('done').innerHTML=`<div class="conf"><h1 style="font-size:24px">You're signed up!</h1><p>Your confirmation code:</p><p style="font-size:30px;font-weight:700">${f.code}</p><p>Copy this code on your paper.</p></div>`}
 };
}

/* ---------- page codes ---------- */
const CODES={ANA:"p/ana","ANA-PAPER":"p/ana-print",SIGNUP:"p/signup",CLINIC:"p/clinic",MOVIE:"p/event-movie",BIKE:"p/event-bike",GARDEN:"p/event-garden","MOVIE-FULL":"p/event-movie-full","BIKE-CANCELED":"p/event-bike-full",
 CITYCART:"p/app-citycart",FITSTEP:"p/app-fitstep",RENTEASY:"p/app-renteasy",TALKFREE:"p/app-talkfree",SHOPSMART:"p/app-shopsmart",OFFER:"p/offer",AUDIT:"p/audit",CLAIMS:"p/claims",GROUPCHAT:"p/groupchat",STORAGE:"p/storage",
 PASSWORD:"print/password",STOPSHEET:"print/stop/generic",COVER1:"print/cover/L1",COVER2:"print/cover/L2",COVER3:"print/cover/L3",COVER4:"print/cover/L4"};
const codeFor=h=>{for(const[k,v]of Object.entries(CODES))if(v===h)return k;const m=h.match(/^(L\d-M\d+)$/);return m?m[1]:null};
function go(){const raw=document.getElementById('goto').value.trim().toUpperCase().replace(/\s+/g,"");const msg=document.getElementById('gomsg');
 let h=CODES[raw];if(!h){const m=raw.match(/^L?(\d)-?M(\d+)$/);if(m&&find(`L${m[1]}-M${m[2]}`))h=`L${m[1]}-M${m[2]}`}
 if(h){msg.textContent="";location.hash="#/"+h}else msg.textContent="Code not found";}
document.getElementById('gobtn').onclick=go;document.getElementById('goto').onkeydown=e=>{if(e.key==="Enter")go()};
function codeBadge(){const h=location.hash.replace(/^#\/?/,"");const c=codeFor(h);const old=document.getElementById('codebadge');if(old)old.remove();
 if(c){const d=document.createElement('p');d.id='codebadge';d.className='note noprint';d.innerHTML=`Page code: <b style="font-size:20px">${c}</b> — write this on the board. Open the Print &amp; Practice Center, type the code in the Page code box, and press Go.`;V.prepend(d)}}
/* ---------- language menu ---------- */
const $lang=document.getElementById('lang'),$st=document.getElementById('trstatus');
function setLang(v){if(!BUILT[v])v="";$lang.value=v;LANG=v;$st.textContent=v?"English + home-language line":"";ls.set("dl-lang",v);route();}
$lang.onchange=()=>setLang($lang.value);
setLang(ls.get("dl-lang")||"");

/* ---------- router ---------- */
function route(){
 USED=new Set();
 const h=location.hash.replace(/^#\/?/,"");const p=h.split("/");window.scrollTo(0,0);
 if(!h)return home();
 if(/^L\d$/.test(h))return level(+h[1]);
 if(/^L\d-M\d+$/.test(h))return modpage(h);
 if(p[0]==="print"){const f={cover:()=>cover(+p[2].slice(1)),password,restart:()=>restart(p[2]),exit:()=>exitT(p[2]),stop:()=>stopS(p[2]),problems:()=>problems(p[2]),challenge:()=>challenge(p[2])}[p[1]];return f?f():home()}
 if(p[0]==="p"){const k=p[1]||"";
  if(k.startsWith("app-"))return app(k.slice(4));
  if(FORMS[k])return form(k);
  if(k==="ana-print")return anaPrint();
  if(k.startsWith("event-")){const [,e,f]=k.split("-");return event(e,!!f)}
  const s={offer,audit,claims,groupchat,storage}[k];if(s)return s();}
 home();
}
window.addEventListener('hashchange',()=>{route();codeBadge()});route();codeBadge();
</script>
